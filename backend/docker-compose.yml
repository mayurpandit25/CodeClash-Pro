services:
  db:
    image: postgres:16-alpine
    container_name: codeclash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeclash}
      POSTGRES_USER: ${POSTGRES_USER:-codeclash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeclash} -d ${POSTGRES_DB:-codeclash}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
